[project]
name = "ncamerging"
version = "0.1.0"
description = "Model merging of Neural Cellular Automata on a physics sandbox"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]